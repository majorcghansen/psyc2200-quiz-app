<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSYC2200 — Lecture 10 Learn</title>
<style>
  :root {
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --correct: #16a34a;
    --incorrect: #dc2626;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .wrap { width: 100%; max-width: 640px; }
  .backlink { display: inline-block; margin-bottom: 12px; color: var(--muted); font-size: 0.85rem; text-decoration: none; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .progress-row { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
  .bar-bg { background: var(--border); border-radius: 999px; height: 10px; overflow: hidden; margin-bottom: 24px; }
  .bar-fill { background: var(--primary); height: 100%; transition: width .3s ease; }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.04);
  }
  .badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--primary);
    background: #dbeafe;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  .prompt { font-size: 1.15rem; line-height: 1.5; margin-bottom: 22px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    text-align: left;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-size: 0.98rem;
    transition: border-color .15s, background .15s;
  }
  .opt:hover:not(:disabled) { border-color: var(--primary); background: #f8faff; }
  .opt:disabled { cursor: default; }
  .opt.correct { border-color: var(--correct); background: #f0fdf4; color: var(--correct); }
  .opt.incorrect { border-color: var(--incorrect); background: #fef2f2; color: var(--incorrect); }
  .write-row { display: flex; gap: 10px; }
  input[type=text] {
    flex: 1;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    font-size: 0.98rem;
  }
  input[type=text]:focus { outline: none; border-color: var(--primary); }
  button.primary {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 14px 20px;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:hover { background: var(--primary-dark); }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.95rem; }
  .feedback.correct { background: #f0fdf4; color: var(--correct); }
  .feedback.incorrect { background: #fef2f2; color: var(--incorrect); }
  .feedback .answer { display: block; margin-top: 4px; color: var(--text); font-weight: 600; }
  .continue-btn { margin-top: 16px; width: 100%; }
  .done { text-align: center; padding: 40px 20px; }
  .done h2 { margin-bottom: 8px; }
  .footer { margin-top: 20px; text-align: center; }
  .footer button {
    background: none; border: none; color: var(--muted); font-size: 0.85rem; text-decoration: underline; cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="index.html">&larr; All lectures</a>
  <h1>PSYC2200 — Lecture 10</h1>
  <div class="sub">Reflexes, Brainstem, Cranial Nerves, Midbrain, Diencephalon, Telencephalon &amp; Cerebral Cortex — Learn Mode</div>
  <div class="progress-row"><span id="progressLabel">0 / 0 mastered</span><span id="remainingLabel"></span></div>
  <div class="bar-bg"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
  <div class="card" id="card"></div>
  <div class="footer"><button id="resetBtn">Reset progress</button></div>
</div>
<script>
const SLUG = "lecture10-psyc2200";
const TERMS = [
  { term: "Monosynaptic reflex", def: "A reflex circuit involving only one synapse (e.g., pulling your hand off a hot object before you consciously feel pain)." },
  { term: "Disynaptic reflex", def: "A reflex circuit involving two synapses, still not requiring the brain to process it." },
  { term: "Crossed-extensor reflex", def: "A reflex where one limb withdraws (flexes) from a painful stimulus while the opposite limb extends to bear weight and keep balance." },
  { term: "Pyramidal decussation", def: "The point in the medulla where axon tracts cross from one side of the body to the other; the boundary between spinal cord and brain." },
  { term: "Decussation", def: "The anatomical term meaning 'crossing over' from one side to the other." },
  { term: "Contralateral", def: "Referring to the opposite side of the body." },
  { term: "Ipsilateral", def: "Referring to the same side of the body." },
  { term: "Medulla oblongata", def: "The most caudal part of the brainstem; controls survival functions like breathing and heartbeat. Developmentally, the myelencephalon." },
  { term: "Sagittal section", def: "A cut through the midline of the brain that separates the left and right sides." },
  { term: "Coronal section", def: "A crown-like cut that separates the front and back portions of the brain." },
  { term: "Horizontal section", def: "A cut that separates the brain into top and bottom slices." },
  { term: "Pons", def: "A brainstem structure sitting above the medulla, part of the metencephalon." },
  { term: "Cerebellum", def: "A hindbrain (metencephalon) structure responsible for fine, discrete motor coordination and movement feedback; contains a majority of the brain's neurons." },
  { term: "Central canal", def: "The fluid-filled channel running through the center of the spinal cord's gray matter; a developmental remnant of the neural tube." },
  { term: "Ventricles", def: "Fluid-filled cavities in the brain, continuous with the spinal cord's central canal, filled with cerebrospinal fluid." },
  { term: "Lateral ventricles", def: "The two large ventricles located in the forebrain (telencephalon)." },
  { term: "Choroid plexus", def: "The tissue that continuously produces cerebrospinal fluid." },
  { term: "Cerebrospinal fluid (CSF)", def: "Fluid that cushions and protects the brain, removes toxins, and bathes the brain and spinal cord." },
  { term: "Meninges", def: "The three membranes that encase the brain and spinal cord, containing the cerebrospinal fluid." },
  { term: "Meningitis", def: "Inflammation of the meninges, which puts pressure on the brain and causes headaches; can be dangerous." },
  { term: "Cranial nerves", def: "The 12 pairs of nerves that bring sensory information in and send motor information out for the head; unlike spinal nerves, they can be purely sensory, purely motor, or mixed." },
  { term: "Olfactory nerve (CN I)", def: "The cranial nerve responsible for smell." },
  { term: "Optic nerve (CN II)", def: "The cranial nerve responsible for vision." },
  { term: "Trigeminal nerve (CN V)", def: "The cranial nerve responsible for facial touch and temperature sensation." },
  { term: "Facial nerve (CN VII)", def: "The cranial nerve responsible for facial muscle movement and expression." },
  { term: "Vagus nerve (CN X)", def: "The cranial nerve that innervates the gut and carries some taste information." },
  { term: "Tegmentum", def: "The bottom portion of the midbrain; contains the reticular formation." },
  { term: "Reticular formation", def: "A midbrain structure responsible for wakefulness, attention, and arousal — like a 'volume knob' for consciousness." },
  { term: "Tectum", def: "The roof of the midbrain, containing the superior and inferior colliculi." },
  { term: "Superior colliculus", def: "A midbrain structure responsible for visual processing and orienting to stimuli." },
  { term: "Inferior colliculus", def: "A midbrain structure responsible for auditory processing and orienting to stimuli." },
  { term: "Hypothalamus", def: "A diencephalon structure that regulates homeostasis (water/weight balance) and controls the pituitary gland/endocrine system." },
  { term: "Pituitary gland", def: "The 'master gland' attached to the hypothalamus that controls the endocrine system." },
  { term: "Thalamus", def: "A diencephalon structure that serves as the major sensory relay between lower brain areas and the cerebral cortex." },
  { term: "Lateral geniculate nucleus (LGN)", def: "The thalamic nucleus that relays visual information from the eye to the visual cortex." },
  { term: "Specific sensory nuclei", def: "Thalamic nuclei that relay a single sensory modality to a specific cortical area." },
  { term: "Specific motor nuclei", def: "Thalamic nuclei that relay information related to movement to motor cortex." },
  { term: "Specific association nuclei", def: "Thalamic nuclei thought to integrate sensory and motor information for a given region." },
  { term: "Nonspecific nuclei", def: "Thalamic nuclei with diffuse connections spread across the whole cerebral cortex." },
  { term: "Pineal gland", def: "The topmost diencephalon structure, involved in regulating circadian rhythms." },
  { term: "Olfactory bulb", def: "A deep telencephalic structure responsible for processing smell; most developed in mammals." },
  { term: "Basal ganglia", def: "A collection of telencephalic nuclei (caudate, putamen, globus pallidus) involved in organizing and monitoring motor movement." },
  { term: "Globus pallidus", def: "A basal ganglia structure involved in motor movement." },
  { term: "Hippocampus", def: "A deep telencephalic structure in the temporal lobe responsible for learning and memory, especially short-term." },
  { term: "Amygdala", def: "A deep telencephalic structure involved in processing emotions and fast processing of some sensory information." },
  { term: "Corpus callosum", def: "The large white-matter tract connecting the left and right cerebral hemispheres; severed in split-brain surgery." },
  { term: "Sulcus", def: "A valley or groove in the cerebral cortex." },
  { term: "Gyrus", def: "A ridge in the cerebral cortex." },
  { term: "Frontal lobe", def: "The cortical lobe containing the motor cortex and responsible for higher-order processing — judgment, reasoning, personality." },
  { term: "Parietal lobe", def: "The cortical lobe containing the somatosensory cortex — processes touch and pain from the body." },
  { term: "Temporal lobe", def: "The cortical lobe responsible for language processing and hearing." },
  { term: "Occipital lobe", def: "The cortical lobe responsible for vision." },
  { term: "Limbic lobe", def: "The cingulate gyrus; a cortical region involved in emotion." },
  { term: "Central sulcus", def: "The groove that divides the frontal lobe from the parietal lobe." },
  { term: "Precentral gyrus", def: "The primary motor cortex, located in the frontal lobe just in front of the central sulcus." },
  { term: "Postcentral gyrus", def: "The primary somatosensory cortex, located in the parietal lobe just behind the central sulcus." },
  { term: "Brodmann areas", def: "Numbered regions of the cerebral cortex, defined by cytoarchitectonics (cell structure across the 6 cortical layers)." },
  { term: "Area 17", def: "The primary visual cortex, in Brodmann's numbering system." },
  { term: "Area 41", def: "The primary auditory cortex, in Brodmann's numbering system." },
  { term: "Area 4", def: "The primary motor cortex, in Brodmann's numbering system." }
];

const STORAGE_KEY = "quizlearn_" + SLUG;
let levels = {};
try { levels = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch(e) { levels = {}; }

const MASTERED = 3;
let current = null;
let answered = false;

function getLevel(i) { return levels[i] || 0; }
function setLevel(i, v) { levels[i] = Math.max(0, Math.min(MASTERED, v)); save(); }
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(levels)); }

function normalize(s) {
  return (s || "").toLowerCase().replace(/[^a-z0-9\s]/g, "").replace(/\s+/g, " ").trim();
}
function acceptableAnswers(term) {
  const m = term.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
  if (m) return [normalize(m[1]), normalize(m[2]), normalize(term)];
  return [normalize(term)];
}

const ROUND_SIZE = 7;

function unmasteredIndices() {
  return TERMS.map((_, i) => i).filter(i => getLevel(i) < MASTERED);
}

function activeRoundIndices() {
  return unmasteredIndices().slice(0, ROUND_SIZE);
}

function pickIndex() {
  const pool = activeRoundIndices();
  if (pool.length === 0) return null;
  const weights = pool.map(i => MASTERED - getLevel(i));
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let k = 0; k < pool.length; k++) {
    r -= weights[k];
    if (r <= 0) return pool[k];
  }
  return pool[pool.length - 1];
}

function updateProgress() {
  const masteredCount = TERMS.filter((_, i) => getLevel(i) >= MASTERED).length;
  const roundCount = activeRoundIndices().length;
  document.getElementById("progressLabel").textContent = masteredCount + " / " + TERMS.length + " mastered";
  document.getElementById("remainingLabel").textContent = roundCount > 0 ? "practicing " + roundCount + " terms this round" : "";
  document.getElementById("barFill").style.width = (masteredCount / TERMS.length * 100) + "%";
}

function randomDistractors(correctIdx, count) {
  const pool = TERMS.map((_, i) => i).filter(i => i !== correctIdx);
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, count).map(i => TERMS[i].term);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderQuestion() {
  answered = false;
  updateProgress();
  const idx = pickIndex();
  if (idx === null) { renderDone(); return; }
  const level = getLevel(idx);
  const type = level < 2 ? "mc" : "written";
  current = { idx, type };
  const term = TERMS[idx];
  const card = document.getElementById("card");

  if (type === "mc") {
    const options = randomDistractors(idx, 3).concat([term.term]);
    for (let i = options.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [options[i], options[j]] = [options[j], options[i]];
    }
    card.innerHTML =
      '<span class="badge">Multiple choice</span>' +
      '<div class="prompt">' + escapeHtml(term.def) + '</div>' +
      '<div class="options">' +
      options.map(o => '<button class="opt" data-answer="' + escapeHtml(o) + '">' + escapeHtml(o) + '</button>').join("") +
      '</div>' +
      '<div id="feedbackArea"></div>';
    card.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => handleMcAnswer(btn, term.term));
    });
  } else {
    card.innerHTML =
      '<span class="badge">Type the answer</span>' +
      '<div class="prompt">' + escapeHtml(term.def) + '</div>' +
      '<div class="write-row">' +
      '<input type="text" id="writtenInput" placeholder="Type the term..." autocomplete="off">' +
      '<button class="primary" id="submitWritten">Submit</button>' +
      '</div>' +
      '<div id="feedbackArea"></div>';
    const input = document.getElementById("writtenInput");
    input.focus();
    const submit = () => handleWrittenAnswer(input.value, term.term);
    document.getElementById("submitWritten").addEventListener("click", submit);
    input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  }
}

function handleMcAnswer(btn, correctTerm) {
  if (answered) return;
  answered = true;
  const chosen = btn.dataset.answer;
  const correct = chosen === correctTerm;
  document.querySelectorAll(".opt").forEach(o => {
    o.disabled = true;
    if (o.dataset.answer === correctTerm) o.classList.add("correct");
    else if (o === btn) o.classList.add("incorrect");
  });
  finishAnswer(correct, correctTerm);
}

function handleWrittenAnswer(value, correctTerm) {
  if (answered) return;
  answered = true;
  const accepted = acceptableAnswers(correctTerm);
  const correct = accepted.includes(normalize(value));
  document.getElementById("writtenInput").disabled = true;
  document.getElementById("submitWritten").disabled = true;
  finishAnswer(correct, correctTerm);
}

function finishAnswer(correct, correctTerm) {
  const idx = current.idx;
  setLevel(idx, getLevel(idx) + (correct ? 1 : -1));
  const fb = document.getElementById("feedbackArea");
  fb.innerHTML =
    '<div class="feedback ' + (correct ? "correct" : "incorrect") + '">' +
    (correct ? "Correct!" : "Not quite.") +
    '<span class="answer">' + escapeHtml(correctTerm) + '</span>' +
    '</div>' +
    '<button class="primary continue-btn" id="continueBtn">Continue</button>';
  document.getElementById("continueBtn").addEventListener("click", renderQuestion);
  updateProgress();
}

function renderDone() {
  document.getElementById("card").innerHTML =
    '<div class="done"><h2>All terms mastered!</h2><p>Great work — you have learned every term in this set.</p></div>';
}

document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("Reset all progress for this lecture?")) {
    levels = {};
    save();
    renderQuestion();
  }
});

renderQuestion();
</script>
</body>
</html>
